[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kunpeng-cli-agent"
version = "0.1.0"
description = "A general-purpose CLI agent with extensible skills and tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kunpeng CLI Agent Team" }]
dependencies = [
  "httpx[socks]>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "prompt-toolkit>=3.0.50,<4",
  "psutil>=6,<8",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "tomli-w>=1.2,<2",
  "tokenizers>=0.22,<0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=13,<18",
]

[project.scripts]
bot = "bot.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bot/assets/skills"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/bot/providers/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]
