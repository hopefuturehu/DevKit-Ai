<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Web UI</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --primary: #e94560;
  --text: #eaeaea;
  --text-dim: #a0a0b0;
  --success: #4ecca3;
  --warn: #f0a500;
  --error: #e94560;
  --border: #2a2a4a;
  --radius: 8px;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.header h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--primary);
  white-space: nowrap;
}
.header .info {
  font-size: 12px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.header .actions {
  display: flex;
  gap: 6px;
}
.header button {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
}
.header button:hover { background: var(--primary); border-color: var(--primary); }
.header .status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
}
.header .status-dot.connected { background: var(--success); }
.header .status-dot.disconnected { background: var(--error); }

/* chat area */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat .msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.chat .msg.user {
  align-self: flex-end;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.chat .msg.assistant {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--border);
}
.chat .msg.system {
  align-self: center;
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-style: italic;
  border: none;
  padding: 4px 8px;
}
.chat .msg.error {
  align-self: center;
  background: rgba(233, 69, 96, 0.15);
  color: var(--error);
  font-size: 13px;
  border: 1px solid rgba(233, 69, 96, 0.3);
}
.chat .msg.tool {
  align-self: flex-start;
  background: rgba(240, 165, 0, 0.1);
  border: 1px solid rgba(240, 165, 0, 0.3);
  font-family: var(--font-mono);
  font-size: 12px;
}
.chat .msg .name {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  font-weight: 600;
}
.chat .msg .time {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
  opacity: 0.7;
}
.streaming { border-left: 2px solid var(--primary) !important; }

/* input */
.input-area {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  background: var(--surface);
}
.input-area textarea {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-family: var(--font-sans);
  font-size: 14px;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  outline: none;
}
.input-area textarea:focus { border-color: var(--primary); }
.input-area button {
  background: var(--primary);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.input-area button:hover { opacity: 0.85; }
.input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
.input-area .stop-btn { background: var(--warn); color: #1a1a2e; }

/* skills bar */
.skills-bar {
  display: flex;
  gap: 6px;
  padding: 6px 16px;
  flex-shrink: 0;
  overflow-x: auto;
  border-top: 1px solid var(--border);
  background: var(--surface);
  font-size: 12px;
}
.skills-bar .skill-tag {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 12px;
  white-space: nowrap;
  cursor: pointer;
  color: var(--text-dim);
}
.skills-bar .skill-tag.active { background: var(--primary); color: white; border-color: var(--primary); }

/* persistent todo list */
.plan-panel {
  padding: 10px 16px;
  flex-shrink: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.plan-panel.hidden { display: none; }
.plan-title { color: var(--text-dim); font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
.plan-explanation { color: var(--text-dim); font-size: 12px; margin-bottom: 5px; }
.plan-item { font-size: 13px; line-height: 1.55; }
.plan-item.completed { color: var(--text-dim); text-decoration: line-through; }
.plan-item.in_progress { color: var(--success); font-weight: 600; }

/* code blocks */
code, pre {
  font-family: var(--font-mono);
  font-size: 13px;
}
pre {
  background: rgba(0,0,0,0.3);
  border-radius: var(--radius);
  padding: 10px;
  overflow-x: auto;
  margin: 6px 0;
}

/* scrollbar */
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 600px) {
  .chat .msg { max-width: 95%; }
  .header h1 { font-size: 14px; }
  .header .info { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="status-dot" id="statusDot"></div>
  <h1>Bot Web UI</h1>
  <span class="info" id="headerInfo">connecting...</span>
  <div class="actions">
    <button onclick="newSession()" title="新建会话">+ New</button>
    <button onclick="compactSession()" title="压缩上下文">≡ Compact</button>
  </div>
</div>

<div class="skills-bar" id="skillsBar"></div>

<div class="plan-panel hidden" id="planPanel">
  <div class="plan-title">TODO</div>
  <div id="planExplanation" class="plan-explanation"></div>
  <div id="planItems"></div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <textarea id="promptInput" rows="1" placeholder="输入任务... (Shift+Enter 换行)"
    onkeydown="handleKey(event)"></textarea>
  <button id="sendBtn" onclick="sendChat()">Send</button>
  <button class="stop-btn" id="stopBtn" onclick="cancelRun()" style="display:none">Stop</button>
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let ws = null;
let sessionId = null;
let running = false;
let activeSkills = [];
let streamingEl = null;
let streamingText = '';
let reconnectTimer = null;

const statusDot = document.getElementById('statusDot');
const headerInfo = document.getElementById('headerInfo');
const chatEl = document.getElementById('chat');
const promptInput = document.getElementById('promptInput');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
const skillsBar = document.getElementById('skillsBar');
const planPanel = document.getElementById('planPanel');
const planExplanation = document.getElementById('planExplanation');
const planItems = document.getElementById('planItems');

// ── websocket ────────────────────────────────────────────────────────────────
function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus(true);
    addSystem('已连接到服务器');
    if (sessionId) {
      ws.send(JSON.stringify({ type: 'resume_session', session_id: sessionId }));
    } else {
      ws.send(JSON.stringify({ type: 'create_session' }));
    }
    fetchStatus();
    fetchSkills();
  };

  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      handleMessage(msg);
    } catch (e) {
      console.error('parse error', e);
    }
  };

  ws.onclose = () => {
    setStatus(false);
    addSystem('连接断开，5 秒后自动重连...');
    scheduleReconnect();
  };

  ws.onerror = () => {
    // onclose will fire after this
  };
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, 5000);
}

function setStatus(connected) {
  statusDot.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
}

// ── message handling ─────────────────────────────────────────────────────────
function handleMessage(msg) {
  if (msg.session_id && sessionId && msg.session_id !== sessionId) return;
  switch (msg.type) {
    case 'session_created':
    case 'session_resumed':
      sessionId = msg.session_id;
      headerInfo.textContent = `session: ${sessionId.slice(0, 8)}...`;
      renderPlan(msg.plan);
      break;

    case 'run.started':
      addSystem(`执行中... "${msg.payload?.prompt || ''}"`);
      setRunning(true);
      break;

    case 'assistant.delta':
      appendStreaming(msg.payload?.text || '');
      break;

    case 'assistant.reasoning.delta':
      // show reasoning as dim text
      appendStreamingReasoning(msg.payload?.text || '');
      break;

    case 'assistant.message':
      finalizeStreaming();
      break;

    case 'tool.requested':
      addTool(`→ ${msg.payload?.name || 'unknown'} ${truncate(msg.payload?.arguments || '', 120)}`);
      break;

    case 'tool.completed':
      addTool(`  ${msg.payload?.success ? '✓' : '✗'} ${msg.payload?.name || ''}${msg.payload?.error ? ': ' + msg.payload.error : ''}`);
      break;

    case 'tool.output':
      // silently ignore large tool outputs in chat unless needed
      break;

    case 'plan.updated':
      renderPlan(msg.payload);
      break;

    case 'skill.activated':
      addSystem(`Skill 激活: ${msg.payload?.name || ''}`);
      break;

    case 'run.completed':
      addSystem(`完成 · ${msg.payload?.steps || 0} 步 · ${msg.payload?.input_tokens || 0}+${msg.payload?.output_tokens || 0} tokens${msg.payload?.cost_usd ? ' · $' + Number(msg.payload.cost_usd).toFixed(4) : ''}`);
      setRunning(false);
      break;

    case 'run.failed':
      addError(`运行失败: ${msg.payload?.error || 'unknown'}`);
      setRunning(false);
      break;

    case 'run_result':
      if (msg.final_text) {
        addAssistant(msg.final_text);
      }
      if (msg.status === 'completed') {
        addSystem(`完成 · ${msg.steps || 0} 步 · ${msg.input_tokens || 0}+${msg.output_tokens || 0} tokens${msg.cost_usd != null ? ' · $' + Number(msg.cost_usd).toFixed(4) : ''}`);
      } else if (msg.error) {
        addError(`错误: ${msg.error}`);
      }
      setRunning(false);
      break;

    case 'compacted':
      addSystem(`上下文已压缩: id=${msg.result?.compaction_id?.slice(0, 8)}...`);
      break;

    case 'error':
      addError(msg.message || '未知错误');
      break;

    case 'pong':
      break;

    default:
      // unknown event, silently ignore
      break;
  }
}

// ── streaming ────────────────────────────────────────────────────────────────
function appendStreaming(text) {
  if (!streamingEl) {
    streamingEl = createMsg('assistant', '');
    streamingEl.classList.add('streaming');
    streamingText = '';
  }
  streamingText += text;
  streamingEl.textContent = streamingText;
  chatEl.scrollTop = chatEl.scrollHeight;
}

function appendStreamingReasoning(text) {
  // reasoning is shown inline dimmed
  if (!streamingEl) {
    streamingEl = createMsg('assistant', '');
    streamingEl.classList.add('streaming');
    streamingText = '';
  }
  streamingText += text;
  streamingEl.innerHTML = `<span style="color:var(--text-dim);font-style:italic">${escapeHtml(streamingText)}</span>`;
  chatEl.scrollTop = chatEl.scrollHeight;
}

function finalizeStreaming() {
  if (streamingEl) {
    streamingEl.classList.remove('streaming');
    streamingEl = null;
    streamingText = '';
  }
}

// ── DOM helpers ──────────────────────────────────────────────────────────────
function createMsg(cls, content) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (content) el.textContent = content;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

function addSystem(text) {
  createMsg('system', text);
}

function addError(text) {
  createMsg('error', text);
}

function addTool(text) {
  createMsg('tool', text);
}

function addAssistant(text) {
  createMsg('assistant', text);
}

function addUser(text) {
  createMsg('user', text);
}

function renderPlan(plan) {
  const items = Array.isArray(plan?.items) ? plan.items : [];
  planItems.replaceChildren();
  planExplanation.textContent = plan?.explanation || '';
  planExplanation.style.display = plan?.explanation ? '' : 'none';
  for (const item of items) {
    const row = document.createElement('div');
    const status = ['pending', 'in_progress', 'completed'].includes(item.status)
      ? item.status : 'pending';
    const marker = { pending: '○', in_progress: '●', completed: '✓' }[status];
    row.className = `plan-item ${status}`;
    row.textContent = `${marker} ${item.content || ''}`;
    planItems.appendChild(row);
  }
  planPanel.classList.toggle('hidden', items.length === 0);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function truncate(obj, n) {
  const s = typeof obj === 'string' ? obj : JSON.stringify(obj);
  return s.length <= n ? s : s.slice(0, n) + '…';
}

// ── actions ──────────────────────────────────────────────────────────────────
function sendChat() {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addError('未连接到服务器');
    return;
  }
  const prompt = promptInput.value.trim();
  if (!prompt) return;

  if (running) {
    addSystem('正在执行中，发送 steering 指令...');
    ws.send(JSON.stringify({ type: 'steer', text: prompt }));
    promptInput.value = '';
    return;
  }

  finalizeStreaming();
  addUser(prompt);
  promptInput.value = '';
  promptInput.style.height = 'auto';

  ws.send(JSON.stringify({
    type: 'chat',
    prompt: prompt,
    skills: activeSkills,
  }));
}

function cancelRun() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cancel' }));
  }
  setRunning(false);
  finalizeStreaming();
}

function newSession() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'new_session' }));
    chatEl.innerHTML = '';
    activeSkills = [];
    renderSkills();
  }
}

function compactSession() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'compact' }));
  }
}

function setRunning(v) {
  running = v;
  sendBtn.style.display = v ? 'none' : '';
  stopBtn.style.display = v ? '' : 'none';
}

// ── skills ───────────────────────────────────────────────────────────────────
function fetchSkills() {
  fetch('/api/skills')
    .then(r => r.json())
    .then(skills => {
      window.availableSkills = skills;
      renderSkills();
    })
    .catch(() => {});
}

function fetchStatus() {
  fetch('/api/status')
    .then(r => r.json())
    .then(s => {
      headerInfo.textContent = `${s.model || '?'} · session: ${sessionId ? sessionId.slice(0, 8) + '...' : '...'}`;
    })
    .catch(() => {});
}

function renderSkills() {
  const skills = window.availableSkills || [];
  skillsBar.innerHTML = skills.map(s => {
    const active = activeSkills.includes(s.name);
    return `<span class="skill-tag${active ? ' active' : ''}"
      onclick="toggleSkill('${s.name}')" title="${escapeHtml(s.description || '')}">
      ${active ? '$' : ''}${s.name}
    </span>`;
  }).join('');
}

function toggleSkill(name) {
  const idx = activeSkills.indexOf(name);
  if (idx >= 0) {
    activeSkills.splice(idx, 1);
  } else {
    activeSkills.push(name);
  }
  renderSkills();
}

// ── keyboard ─────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

// ── init ─────────────────────────────────────────────────────────────────────
connect();
promptInput.focus();
</script>
</body>
</html>
