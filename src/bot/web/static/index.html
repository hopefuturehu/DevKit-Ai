<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bot · 任务工作台</title>
  <link rel="stylesheet" href="/static/workbench.css">
  <script type="module" src="/static/app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <button id="navToggle" class="icon-button" aria-label="展开会话列表" aria-expanded="false">☰</button>
    <a class="brand" href="/">BOT<span>工作台</span></a>
    <span id="modelName" class="muted">正在连接…</span>
    <span id="connection" class="connection" role="status">连接中</span>
    <label class="theme-picker"><span class="sr-only">外观</span><select id="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </header>
  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="会话列表">
      <div class="sidebar-heading"><span>会话</span><button id="newSession" aria-label="新建会话">＋ 新建</button></div>
      <div id="sessions" class="session-list"></div>
      <button id="moreSessions" class="quiet" hidden>更多会话</button>
      <div class="sidebar-footer"><span id="workspacePath"></span></div>
    </aside>
    <main id="main" class="main">
      <div class="run-heading">
        <div><div class="eyebrow">当前任务</div><h1 id="taskTitle">开始一个任务</h1></div>
        <label class="run-picker"><span class="sr-only">历史任务</span><select id="runPicker"><option value="">新任务</option></select></label>
      </div>
      <div id="runMeta" class="run-meta"></div>
      <div id="alert" class="alert" role="alert" hidden></div>
      <details id="planPanel" class="plan-panel" open hidden><summary id="planSummary">任务计划</summary><p id="planExplanation" class="muted"></p><ol id="planItems"></ol></details>
      <div class="content-tabs" aria-label="任务视图"><button data-panel="activity" aria-pressed="true">执行过程</button><button data-panel="artifacts" aria-pressed="false">文件与产物</button><button data-panel="children" aria-pressed="false">子任务</button><button data-panel="context" aria-pressed="false">上下文</button><button data-panel="analysis" aria-pressed="false">历史分析</button></div>
      <section id="activityPanel" class="activity-panel" aria-label="对话与执行过程">
        <div id="activityScroller" class="activity-scroller">
          <button id="moreActivity" class="quiet" hidden>显示更早的步骤</button>
          <div id="activity" class="activity"></div>
          <div id="emptyState" class="empty-state"><div class="empty-mark">B</div><h2>让 Bot 开始工作</h2><p>描述任务，即可在这里查看计划、执行过程与结果。</p></div>
        </div>
        <button id="followLatest" class="follow-latest" hidden>回到最新</button>
      </section>
      <section id="artifactsPanel" class="secondary-panel" aria-label="文件产物" hidden></section>
      <section id="childrenPanel" class="secondary-panel" aria-label="子任务" hidden></section>
      <section id="contextPanel" class="secondary-panel" aria-label="上下文信息" hidden></section>
      <section id="analysisPanel" class="secondary-panel" aria-label="历史任务分析台" hidden>
        <div class="analysis-head">
          <div>
            <div class="eyebrow">跨会话统计</div>
            <h2>历史任务分析台</h2>
          </div>
          <div class="analysis-actions">
            <button id="analysisRefresh" class="quiet">刷新</button>
            <button id="analysisExport" class="primary">导出 JSON</button>
          </div>
        </div>
        <details id="analysisMethod" class="method-panel">
          <summary>统计口径说明</summary>
          <div id="analysisMethodBody" class="method-body"></div>
        </details>
        <div class="analysis-filters">
          <label>状态<select id="filterStatus"><option value="">全部</option><option value="completed">已完成</option><option value="failed">失败</option><option value="cancelled">已停止</option><option value="blocked">被阻塞</option><option value="limit_reached">达到上限</option><option value="running">运行中</option></select></label>
          <label>停止原因<select id="filterReason"><option value="">全部</option></select></label>
          <label>排序<select id="filterSort"><option value="net">净耗时</option><option value="total">总耗时</option><option value="approval">审批等待</option><option value="started">开始时间</option><option value="events">事件数</option></select></label>
          <label>方向<select id="filterOrder"><option value="desc">降序</option><option value="asc">升序</option></select></label>
          <label class="grow">搜索<textarea id="filterSearch" rows="1" placeholder="按任务描述筛选"></textarea></label>
          <label>空档阈值(s)<input id="filterGap" type="number" min="0" max="86400" step="10" value="120"></label>
        </div>
        <div id="analysisSummary" class="metric-grid"></div>
        <div id="analysisReasons" class="reason-list"></div>
        <div id="analysisCompare" class="compare-panel" hidden></div>
        <div id="analysisTable" class="analysis-table"></div>
        <div id="analysisDetail" class="analysis-detail" hidden></div>
      </section>
      <section class="composer" aria-label="任务输入">
        <div class="composer-heading"><label id="promptLabel" for="prompt">描述任务</label><details class="skills-picker"><summary>Skills</summary><div id="skillsList"></div></details></div>
        <textarea id="prompt" placeholder="例如：帮我检查项目中的配置加载逻辑，定位问题并验证。" rows="2"></textarea>
        <div class="composer-actions"><span class="muted" id="inputHint">Enter 发送 · Shift+Enter 换行</span><button id="compact" class="quiet">整理上下文</button><button id="stop" class="danger" hidden>停止任务</button><button id="send" class="primary">开始任务</button></div>
        <div id="sendStatus" class="muted" role="status"></div>
      </section>
    </main>
    <aside id="inspector" class="inspector" aria-label="执行详情" hidden>
      <header class="inspector-heading"><div><div class="eyebrow" id="detailKind">工具详情</div><h2 id="detailTitle"></h2></div><button id="closeInspector" class="icon-button" aria-label="关闭详情">×</button></header>
      <div id="detailMeta" class="detail-meta"></div>
      <div id="detailTabs" class="detail-tabs"><button data-detail="output" aria-pressed="true">输出</button><button data-detail="arguments" aria-pressed="false">参数</button><button data-detail="events" aria-pressed="false">事件</button></div>
      <div id="detailBody" class="detail-body"></div>
      <div id="detailActions" class="detail-actions"></div>
    </aside>
  </div>
</body>
</html>
